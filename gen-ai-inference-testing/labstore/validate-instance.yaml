AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Off-block validation instance. Exercises everything about the trn2 workflow
  that does NOT require a Neuron device, so failures surface at ~$0.90/hour
  instead of inside a Capacity Block at ~$36/hour.

  Validates:
    1. nvme-setup against REAL instance-store disks (mdadm RAID0 + xfs).
       m5d.4xlarge has 2 disks, so the RAID path is taken, not the
       single-disk shortcut.
    2. labstore init / status / resume against the REAL EFS and S3, including
       hydrating the pre-staged ~62 GB checkpoint and timing it.
    3. The container image: pull the Neuron DLC base, build our layer, and
       push to ECR so the Capacity Block pulls a known-good image instead of
       building one.

  Access is SSM only. Delete the stack when PHASE=DONE appears.

Parameters:
  InstanceType:
    Description: Must have 2+ instance-store disks to exercise the RAID0 path.
    Type: String
    Default: m5d.4xlarge
  RootVolumeSizeGb:
    Description: Holds the Neuron DLC base image plus our built layer.
    Type: Number
    Default: 200
    MinValue: 100
  VpcId:
    Type: 'AWS::EC2::VPC::Id'
  SubnetId:
    Description: Must be in an AZ where the lab EFS has a mount target.
    Type: 'AWS::EC2::Subnet::Id'
  EfsId:
    Type: String
    Default: fs-090ea92bfa28de363
  LabBucket:
    Type: String
    Default: dl-lab-store-489829964455-us-east-2
  LabS3Prefix:
    Type: String
    Default: lab
  EcrRepositoryUri:
    Type: String
    Default: 489829964455.dkr.ecr.us-east-2.amazonaws.com/dl-lab-inference
  ModelId:
    Type: String
    Default: Qwen/Qwen3-32B
  DlcImage:
    Type: String
    Default: public.ecr.aws/neuron/pytorch-inference-vllm-neuronx:0.29.0.1.2.0-neuronx-py314-sdk2.33.0-ubuntu26.04
  RepoUrl:
    Type: String
    Default: https://github.com/ratnopam/aws-deep-learning-ami-ubuntu-dcv-desktop.git
  RepoBranch:
    Type: String
    Default: trn2-qwen3-torchneuron-vllm
  UbuntuAmiSsmParameter:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:

  ValidateRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: lab-store-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: ['s3:PutObject', 's3:GetObject', 's3:DeleteObject', 's3:AbortMultipartUpload']
                Resource: !Sub 'arn:aws:s3:::${LabBucket}/${LabS3Prefix}/*'
              - Effect: Allow
                Action: ['s3:ListBucket', 's3:GetBucketLocation']
                Resource: !Sub 'arn:aws:s3:::${LabBucket}'
        - PolicyName: ecr-push
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # GetAuthorizationToken is not resource-scopable.
              - Effect: Allow
                Action: 'ecr:GetAuthorizationToken'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:CompleteLayerUpload'
                  - 'ecr:InitiateLayerUpload'
                  - 'ecr:PutImage'
                  - 'ecr:UploadLayerPart'
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/dl-lab-inference'

  ValidateProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Roles: [!Ref ValidateRole]

  ValidateSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Validation instance - egress only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: HTTPS for ECR, S3, apt, git
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: HTTP for apt
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: NFS to the lab EFS mount targets
          IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  ValidateInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId: !Ref UbuntuAmiSsmParameter
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ValidateProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!GetAtt ValidateSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGb
            VolumeType: gp3
            Iops: 6000
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}'
        - Key: Purpose
          Value: offblock-validation
        - Key: Project
          Value: trn2-torchneuron-vllm
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Positional args are used WITHOUT brace-default syntax, and no brace
          # forms appear even in comments: Fn::Sub parses this entire string.
          exec > >(tee -a /var/log/validate.log) 2>&1
          STATUS=/var/log/validate-status
          phase() { echo "PHASE=$1 AT=$(date -u +%H:%M:%SZ) $2" | tee -a $STATUS; }
          warn()  { echo "PHASE=WARN AT=$(date -u +%H:%M:%SZ) WHERE=$1 $2" | tee -a $STATUS; }
          fail()  { echo "PHASE=FAILED AT=$(date -u +%H:%M:%SZ) WHERE=$1" | tee -a $STATUS; exit 1; }
          : > $STATUS

          phase APT
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq || fail apt-update
          apt-get install -y -qq git jq curl unzip nfs-common mdadm xfsprogs docker.io \
            || fail apt-install
          systemctl enable --now docker || fail docker-start

          phase AWSCLI
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/a.zip || fail awscli-dl
          unzip -q /tmp/a.zip -d /tmp/awscli-pkg || fail awscli-unzip
          /tmp/awscli-pkg/aws/install >/dev/null || fail awscli-install
          export PATH=/usr/local/bin:$PATH
          phase AWSCLI_OK "$(aws --version 2>&1)"

          phase EFS_MOUNT
          mkdir -p /home/ubuntu/efs
          # Same mount options the desktop template uses, so this is a faithful test.
          mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport \
            ${EfsId}.efs.${AWS::Region}.amazonaws.com:/ /home/ubuntu/efs || fail efs-mount
          chown ubuntu:ubuntu /home/ubuntu/efs
          phase EFS_MOUNT_OK "$(df -h /home/ubuntu/efs | tail -1)"

          phase CLONE
          git clone --depth 1 -b ${RepoBranch} ${RepoUrl} /opt/repo || fail clone
          LS=/opt/repo/gen-ai-inference-testing/labstore/labstore.sh
          chmod +x /opt/repo/gen-ai-inference-testing/labstore/*.sh
          chown -R ubuntu:ubuntu /opt/repo

          # ---- TEST 1: real instance-store RAID0 ----------------------------
          phase NVME "real disks, expecting mdadm RAID0 over 2"
          lsblk -dn -o NAME,MODEL | tee -a /var/log/validate.log
          bash $LS nvme-setup || fail nvme-setup
          if mountpoint -q /mnt/nvme; then
            phase NVME_OK "$(df -h /mnt/nvme | tail -1)"
            cat /proc/mdstat 2>/dev/null | head -4
          else
            fail nvme-not-mounted
          fi

          # ---- TEST 2: labstore against real EFS and S3 ---------------------
          export LAB_EFS_ROOT=/home/ubuntu/efs/lab
          export LAB_LOCAL_ROOT=/mnt/nvme/lab
          export LAB_S3_BUCKET=${LabBucket}
          export LAB_S3_PREFIX=${LabS3Prefix}
          export AWS_REGION=${AWS::Region}
          export MODEL_ID=${ModelId}
          export MODEL_REVISION=main
          export TOPOLOGY=tp8-lnc2
          mkdir -p /mnt/nvme/lab && chown -R ubuntu:ubuntu /mnt/nvme/lab

          phase STORE_INIT
          bash $LS init || fail labstore-init
          phase STORE_STATUS
          bash $LS status 2>&1 | tail -20

          phase STORE_RESUME "hydrating the pre-staged checkpoint from S3"
          T0=$(date +%s)
          bash $LS resume || fail labstore-resume
          T1=$(date +%s)
          SZ=$(du -sh /mnt/nvme/lab/models/qwen-qwen3-32b 2>/dev/null | cut -f1)
          phase STORE_RESUME_OK "size=$SZ seconds=$((T1-T0))"
          # Prove the hydrated checkpoint is complete, not just present.
          test -f /mnt/nvme/lab/models/qwen-qwen3-32b/config.json || fail hydrate-no-config
          NSAFE=$(ls /mnt/nvme/lab/models/qwen-qwen3-32b/*.safetensors 2>/dev/null | wc -l)
          phase HYDRATE_VERIFY "safetensors=$NSAFE expected=18"
          test "$NSAFE" -eq 18 || warn hydrate-shard-count "got $NSAFE"

          # ---- TEST 3: container image -------------------------------------
          phase IMAGE_PULL "${DlcImage}"
          docker pull ${DlcImage} || fail docker-pull
          phase IMAGE_PULL_OK "$(docker images --format '{{.Size}}' ${DlcImage} | head -1)"

          phase IMAGE_BUILD
          cd /opt/repo/gen-ai-inference-testing/trn2-qwen3-torchneuron
          docker build -t openai_server-vllm_native:neuron -f containers/Dockerfile . || fail docker-build
          phase IMAGE_BUILD_OK "$(docker images --format '{{.Size}}' openai_server-vllm_native:neuron | head -1)"

          # The platform probe needs a Neuron device, so it cannot pass here.
          # Record what it says anyway: it should fail for a MISSING DEVICE,
          # not for a missing module, which would mean a broken image.
          phase PROBE_EXPECT_FAIL
          docker run --rm openai_server-vllm_native:neuron \
            python -c "import vllm; from vllm.platforms import current_platform; print(current_platform.device_name)" 2>&1 | tail -3

          phase ECR_PUSH
          aws ecr get-login-password --region ${AWS::Region} \
            | docker login --username AWS --password-stdin ${EcrRepositoryUri} || fail ecr-login
          docker tag openai_server-vllm_native:neuron ${EcrRepositoryUri}:qwen3-trn2-validated || fail docker-tag
          docker push ${EcrRepositoryUri}:qwen3-trn2-validated || fail ecr-push
          phase ECR_PUSH_OK "${EcrRepositoryUri}:qwen3-trn2-validated"

          phase STORE_SAVE
          bash $LS save 2>&1 | tail -5 || warn labstore-save

          phase DONE "all off-block checks finished -- safe to delete this stack"

Outputs:
  InstanceId:
    Value: !Ref ValidateInstance
  SsmSession:
    Value: !Sub 'aws ssm start-session --target ${ValidateInstance} --region ${AWS::Region}'
  Reminder:
    Value: 'Delete this stack once PHASE=DONE appears; the instance is billed until then.'
