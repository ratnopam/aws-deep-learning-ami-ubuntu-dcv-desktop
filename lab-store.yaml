AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Durable lab store for ephemeral accelerator desktops (Trainium and GPU).
  Creates an EFS file-system with Elastic throughput and mount targets in up to
  three Availability Zones, an S3 bucket, and an ECR repository.

  This stack is PERMANENT and independent of any desktop stack. Desktop stacks
  stay ephemeral and consume it by passing only the exported EFSFileSystemId to
  deep-learning-ubuntu-desktop.yaml -- that template is NOT modified, and
  callers that omit the parameter keep today's behaviour exactly.

  Hardware-agnostic: the same store serves trn1/trn2/inf2 and GPU desktops.
  Weights and results are hardware-independent and shared; compile caches are
  keyed by accelerator class, model and stack version by the tooling.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Networking }
        Parameters: [VpcId, VpcCidr, SubnetAz1, SubnetAz2, SubnetAz3]
      - Label: { default: EFS }
        Parameters: [ThroughputMode, ProvisionedThroughputInMibps, TransitionToIA]
      - Label: { default: S3 and ECR }
        Parameters: [S3BucketName, EcrRepositoryName]

Parameters:
  VpcId:
    Description: VPC in which to create EFS mount targets.
    Type: 'AWS::EC2::VPC::Id'

  VpcCidr:
    Description: >-
      CIDR permitted to mount the file-system (NFS 2049). Scoping to the VPC CIDR
      lets desktop stacks create their own security groups and still reach EFS,
      so no desktop template changes are required. Tighten to a security-group
      pair if this stops being a single-tenant account.
    Type: String
    Default: 172.31.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  SubnetAz1:
    Description: >-
      Subnet for a mount target. Mount targets are per-AZ and free; an instance
      in an AZ with no mount target cannot use the file-system at all. Capacity
      Blocks pick the AZ, so cover every AZ you might land in.
    Type: 'AWS::EC2::Subnet::Id'
  SubnetAz2:
    Description: Second AZ subnet. Leave as 'none' to skip.
    Type: String
    Default: 'none'
  SubnetAz3:
    Description: Third AZ subnet. Leave as 'none' to skip.
    Type: String
    Default: 'none'

  ThroughputMode:
    Description: >-
      Use 'elastic'. With 'bursting', throughput scales with STORED data
      (~50 KiB/s per GiB), so a near-empty file-system is effectively unusable --
      reading a 65 GB checkpoint would be slower than re-downloading it.
    Type: String
    Default: elastic
    AllowedValues: [elastic, bursting, provisioned]

  ProvisionedThroughputInMibps:
    Description: Only used when ThroughputMode is 'provisioned'. Ignored otherwise.
    Type: Number
    Default: 0

  TransitionToIA:
    Description: >-
      Move untouched files to Infrequent Access to cut storage cost. IA has a
      higher first-byte latency, so do not set this below 30 days if you expect
      to restore a compile cache between Capacity Blocks.
    Type: String
    Default: AFTER_30_DAYS
    AllowedValues: [DISABLED, AFTER_30_DAYS, AFTER_60_DAYS, AFTER_90_DAYS]

  S3BucketName:
    Description: >-
      Bucket for durable weights, cache backups and results. Must be globally
      unique. Leave blank to skip bucket creation and reuse an existing one.
    Type: String
    Default: ''

  EcrRepositoryName:
    Description: ECR repository for built inference images. Leave blank to skip.
    Type: String
    Default: dl-lab-inference

Conditions:
  HasAz2: !Not [!Equals [!Ref SubnetAz2, 'none']]
  HasAz3: !Not [!Equals [!Ref SubnetAz3, 'none']]
  IsProvisioned: !Equals [!Ref ThroughputMode, 'provisioned']
  HasLifecycle: !Not [!Equals [!Ref TransitionToIA, 'DISABLED']]
  CreateBucket: !Not [!Equals [!Ref S3BucketName, '']]
  CreateEcr: !Not [!Equals [!Ref EcrRepositoryName, '']]

Resources:

  # Retained on stack deletion: the whole point is that it outlives everything.
  LabEfs:
    Type: 'AWS::EFS::FileSystem'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose   # maxIO raises per-op latency; wrong for many small cache files
      ThroughputMode: !Ref ThroughputMode
      ProvisionedThroughputInMibps: !If
        - IsProvisioned
        - !Ref ProvisionedThroughputInMibps
        - !Ref 'AWS::NoValue'
      LifecyclePolicies: !If
        - HasLifecycle
        - - TransitionToIA: !Ref TransitionToIA
          - TransitionToPrimaryStorageClass: AFTER_1_ACCESS
        - !Ref 'AWS::NoValue'
      FileSystemTags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lab-store'
        - Key: Purpose
          Value: durable-lab-store

  LabEfsSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: NFS access to the durable lab store
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: NFS from within the VPC
          IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-efs'

  MountTargetAz1:
    Type: 'AWS::EFS::MountTarget'
    Properties:
      FileSystemId: !Ref LabEfs
      SubnetId: !Ref SubnetAz1
      SecurityGroups: [!GetAtt LabEfsSecurityGroup.GroupId]

  MountTargetAz2:
    Condition: HasAz2
    Type: 'AWS::EFS::MountTarget'
    Properties:
      FileSystemId: !Ref LabEfs
      SubnetId: !Ref SubnetAz2
      SecurityGroups: [!GetAtt LabEfsSecurityGroup.GroupId]

  MountTargetAz3:
    Condition: HasAz3
    Type: 'AWS::EFS::MountTarget'
    Properties:
      FileSystemId: !Ref LabEfs
      SubnetId: !Ref SubnetAz3
      SecurityGroups: [!GetAtt LabEfsSecurityGroup.GroupId]

  LabBucket:
    Condition: CreateBucket
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref S3BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Weights are large, immutable and re-downloadable; IA after 60 days.
          - Id: weights-to-ia
            Status: Enabled
            Prefix: lab/models/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 60
          # Multipart debris from interrupted 65 GB uploads is pure cost.
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Purpose
          Value: durable-lab-store

  LabEcrRepository:
    Condition: CreateEcr
    Type: 'AWS::ECR::Repository'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: false
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 10 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  EfsId:
    Description: >-
      Pass this as EFSFileSystemId to deep-learning-ubuntu-desktop.yaml. That is
      the ONLY wiring needed -- the desktop template is unmodified, and the
      desktop security group it creates already permits TCP egress to NFS.
    Value: !Ref LabEfs
    Export:
      Name: !Sub '${AWS::StackName}-EfsId'

  EfsSecurityGroupId:
    Description: Security group attached to the EFS mount targets.
    Value: !GetAtt LabEfsSecurityGroup.GroupId
    Export:
      Name: !Sub '${AWS::StackName}-EfsSecurityGroupId'

  EfsThroughputMode:
    Description: Throughput mode in effect. Should read 'elastic'.
    Value: !Ref ThroughputMode

  MountTargetAzs:
    Description: AZ subnets that received a mount target.
    Value: !Join
      - ','
      - - !Ref SubnetAz1
        - !If [HasAz2, !Ref SubnetAz2, 'none']
        - !If [HasAz3, !Ref SubnetAz3, 'none']

  BucketName:
    Condition: CreateBucket
    Description: Durable bucket for weights, cache backups and results.
    Value: !Ref LabBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  EcrRepositoryUri:
    Condition: CreateEcr
    Description: ECR repository URI for built inference images.
    Value: !GetAtt LabEcrRepository.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-EcrRepositoryUri'
